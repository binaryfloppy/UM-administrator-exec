# ==============================================================================
# Configuration de deploiement - Cluster Universal Messaging 12.1 & um_admin
# ==============================================================================

# Image Docker pour le conteneur d'administration (IHM + Prometheus)
# Peut etre une image locale (um_admin:latest) importee via docker load, ou sur un registre
UM_ADMIN_IMAGE="um_admin:latest"

# Image Docker Universal Messaging
UM_IMAGE="ibmwebmethods.azurecr.io/universalmessaging-server:12.1"

# Nom du cluster UM
CLUSTER_NAME="umcluster"

# Nom du reseau Docker utilise par le cluster et l'IHM
DOCKER_NETWORK="um_default"

# Ports externes exposes sur l'hote pour chaque noeud UM (interne : 9000)
UM1_PORT="2001"
UM2_PORT="2002"
UM3_PORT="2003"

# Port externe pour l'interface web d'administration
UM_ADMIN_PORT="8088"

# Port externe pour le serveur Prometheus
PROMETHEUS_PORT="9090"

# Mot de passe administrateur UM (laisser vide si aucune authentification requise)
UM_ADMIN_UM_PASSWORD=""
